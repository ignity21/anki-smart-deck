# ankinote web GUI.
#
#   docker compose up -d      # pull the published image and run
#
# The GUI talks to the Anki desktop app on the host via AnkiConnect. In the
# AnkiConnect add-on config set "webBindAddress": "0.0.0.0" and add the container
# origin to "webCorsOriginList" (or use "*"), then restart Anki.

services:
  ankinote:
    image: ${ANKINOTE_IMAGE:-ghcr.io/ignity21/ankinote-ai:latest}
    # Build locally instead of pulling:
    #   ANKINOTE_VERSION=0.3.1 docker compose build
    # build:
    #   context: .
    #   args:
    #     ANKINOTE_VERSION: ${ANKINOTE_VERSION:?set ANKINOTE_VERSION}
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      ANKI_CONNECT_URL: ${ANKI_CONNECT_URL:-http://host.docker.internal:8765}
      # Generate one: openssl rand -hex 32
      ANKINOTE_STORAGE_SECRET: ${ANKINOTE_STORAGE_SECRET:-ankinote-ui-session-key}
    extra_hosts:
      # Lets the container reach the host on Linux too (Docker Desktop provides
      # host.docker.internal natively).
      - "host.docker.internal:host-gateway"
    volumes:
      # Provider profiles and API keys entered on the Settings page.
      - ankinote-config:/config
    restart: unless-stopped

volumes:
  ankinote-config:

{{FrontSide}}
<section class="panel">
  {{#summary}}
  <div class="section-title">Overview</div>
  <div class="brief">{{summary}}</div>
  {{/summary}}
  {{#steps}}
  <div class="section-title">Steps</div>
  <div class="detail">{{steps}}</div>
  {{/steps}}
  {{#conditions}}
  <div class="section-title">Conditions</div>
  <div class="detail">{{conditions}}</div>
  {{/conditions}}
  {{#image}}<div class="diagram-container">{{image}}</div>{{/image}}
  {{#Tags}}<div class="section-title">Tags</div><div class="tags">{{Tags}}</div>{{/Tags}}
</section>

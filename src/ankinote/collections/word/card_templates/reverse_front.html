<div class="word-front">
    <!-- Use definition as the main prompt on the front side -->
    {{#definitions}}
    <div class="section-container">
        <div class="section-title">Definition</div>
        <div class="definitions-container">{{definitions}}</div>
    </div>
    {{/definitions}}

    <div class="badge-row">
        {{#difficulty}}
        <div class="badge difficulty-badge">{{difficulty}}</div>
        {{/difficulty}}

        {{#part_of_speech}}
        <div class="badge part-of-speech-badge">{{part_of_speech}}</div>
        {{/part_of_speech}}
    </div>
</div>

{{FrontSide}}
<section class="panel">
  {{#target_sentence}}
  <div class="section-title">Target Sentence</div>
  <div class="sentence-target">
    <span class="target-text">{{target_sentence}}</span>
    {{#pron_audio}}<span class="inline-audio">{{pron_audio}}</span>{{/pron_audio}}
  </div>
  {{/target_sentence}}

  {{#phrases}}
  <div class="section-title">Key Phrases</div>
  <div>{{phrases}}</div>
  {{/phrases}}

  {{#notes}}
  <div class="section-title">Notes</div>
  <div class="notes-list">{{notes}}</div>
  {{/notes}}

  {{#user_notes}}
  <div class="section-title">My Notes</div>
  <div class="notes-list">{{user_notes}}</div>
  {{/user_notes}}
</section>

{{FrontSide}}
<hr id="answer">

{{#target_sentence}}
<div class="section-container">
    <div class="section-title">Target Sentence</div>
    <div class="sentence">{{target_sentence}}</div>
</div>
{{/target_sentence}}

{{#grammars}}
<div class="section-container">
    <div class="section-title">Grammar</div>
    <div class="notes-container">{{grammars}}</div>
</div>
{{/grammars}}

{{#phrases}}
<div class="section-container">
    <div class="section-title">Phrases</div>
    <div class="notes-container">{{phrases}}</div>
</div>
{{/phrases}}

{{#notes}}
<div class="section-container">
    <div class="section-title">Notes</div>
    <div class="notes-container">{{notes}}</div>
</div>
{{/notes}}

{{#user_notes}}
<div class="user-notes-container">
    <div class="section-title user-notes-title">My Study Notes</div>
    <div>{{user_notes}}</div>
</div>
{{/user_notes}}
